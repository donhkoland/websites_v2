<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">VIK — A world, taking shape.</title><desc id="desc">Web platform V2. Graphic development 21%. VIK José Ignacio is the first approved direction.</desc><rect width="1200" height="330" fill="#f6f4ed"/><path d="M42 47H1158M42 274H1158" stroke="#c9c8bc"/><text x="44" y="84" fill="#233b35" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">VIK / WEB PLATFORM V2</text><text x="42" y="163" fill="#233b35" font-family="Georgia,serif" font-size="64">A world, taking shape.</text><text x="46" y="206" fill="#636b61" font-family="Arial,sans-serif" font-size="18">One shared design language. A growing family of places.</text><text x="45" y="306" fill="#233b35" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.8">FIRST APPROVED DIRECTION / VIK JOSÉ IGNACIO</text><text x="1090" y="125" text-anchor="middle" fill="#233b35" font-family="Georgia,serif" font-size="56">21%</text><text x="1090" y="149" text-anchor="middle" fill="#636b61" font-family="Arial,sans-serif" font-size="11">GRAPHIC DEVELOPMENT</text><rect x="1010" y="175" width="160" height="4" fill="#dedfd3"/><rect x="1010" y="175" width="33.6" height="4" fill="#73865d"/></svg>