<link rel="stylesheet" href="../_core/vik-core.css?v=39">

<style>
  /* ══ THE ROOM PAGE ═══════════════════════════════════════════════
     Brought over from Galleria VIK, where it is written ten
     times over — once per room type. Here it is written once and reads
     which room it is from the address, so fifty-five rooms share one
     document.

     Anatomy, in order: the gallery hero with its strip, the
     breadcrumb, the bar of specifications, the prose, and the other
     rooms of the same house. */
  .rp{padding-top:var(--nav-h)}
  .rp-hero{display:grid;grid-template-columns:1fr 300px;gap:2px;
    height:min(74vh,720px);background:var(--line)}
  .rp-hero__main{position:relative;overflow:hidden;background:#141312}
  .rp-hero__main img{width:100%;height:100%;object-fit:cover;display:block}
  .rp-strip{display:grid;grid-template-rows:repeat(3,1fr);gap:2px}
  .rp-thumb{position:relative;overflow:hidden;background:#141312;cursor:pointer}
  .rp-thumb img{width:100%;height:100%;object-fit:cover;display:block;
    transition:transform 1.2s var(--slow)}
  .rp-thumb:hover img{transform:scale(1.04)}
  .rp-thumb--more{display:flex;align-items:center;justify-content:center;
    background:var(--ink)}
  .rp-thumb--more span{font-family:"Highway Gothic Expanded","Arial Narrow",sans-serif;
    font-size:9.3px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone)}

  .rp-body{max-width:var(--max);margin:0 auto;
    padding:clamp(2.5rem,6vw,4.5rem) var(--pad-x) clamp(3rem,7vw,5rem);
    display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:clamp(2rem,5vw,4rem)}
  .rp-crumb{display:flex;gap:.6rem;align-items:baseline;margin-bottom:1.5rem;
    font-family:"Highway Gothic Expanded","Arial Narrow",sans-serif;font-size:9.3px;
    letter-spacing:.22em;text-transform:uppercase;color:rgba(30,30,30,.45)}
  .rp-crumb a{color:rgba(30,30,30,.45);transition:color .25s}
  /* el dedo: la miga es lo primero que se toca en esta pagina */
  @media (max-width:1024px), (pointer:coarse){
    .rp-crumb a{display:inline-flex;align-items:center;min-height:40px}
  }
  .rp-crumb a:hover{color:var(--vik)}
  .rp-title{font-family:"Old Standard VIK",Georgia,serif;
    font-size:clamp(2.4rem,6vw,4rem);line-height:1.02;letter-spacing:-0.018em;
    color:var(--ink);margin-bottom:.6rem}
  .rp-place{font-family:"Highway Gothic Expanded","Arial Narrow",sans-serif;font-size:9.3px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--vik);display:block;
    margin-bottom:2.25rem}

  .rp-specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);margin-bottom:2.75rem}
  .rp-spec{background:var(--canvas);padding:1.15rem 1.25rem;display:flex;
    flex-direction:column;gap:.4rem}
  .rp-spec__l{font-family:"Highway Gothic Expanded","Arial Narrow",sans-serif;
    font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(30,30,30,.4)}
  .rp-spec__v{font-family:"Old Standard VIK",Georgia,serif;font-size:1.05rem;
    line-height:1.25;color:var(--ink)}

  .rp-copy{max-width:56ch;font-size:1rem;line-height:1.9;font-weight:300;
    color:rgba(30,30,30,.72);margin-bottom:1.25rem}

  .rp-aside{align-self:start;position:sticky;top:calc(var(--nav-h) + 2rem);
    border:1px solid var(--line);padding:1.75rem}
  .rp-aside p{font-size:.9rem;line-height:1.8;font-weight:300;
    color:rgba(30,30,30,.6);margin:.9rem 0 1.5rem}
  .rp-aside .btn-solid{width:100%;justify-content:center}

  .rp-others{border-top:1px solid var(--line)}
  @media (max-width:900px){
    .rp-hero{grid-template-columns:1fr;height:auto}
    .rp-hero__main{aspect-ratio:4/5}
    .rp-strip{grid-template-rows:none;grid-template-columns:repeat(3,1fr)}
    .rp-thumb{aspect-ratio:1}
    .rp-body{grid-template-columns:1fr}
    .rp-aside{position:static}
    .rp-specs{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:520px){ .rp-specs{grid-template-columns:1fr} }
</style>
</head>
<body data-site="destination">

<div data-vik-chrome data-page="stay" data-logo="ji"></div>

<main class="rp" id="main">
  <section class="rp-hero" aria-label="Room photographs" id="rpHero"></section>

  <div class="rp-body">
    <div class="rp-content">
      <nav class="rp-crumb" aria-label="Breadcrumb" id="rpCrumb"></nav>
      <h1 class="rp-title" id="rpTitle"></h1>
      <span class="rp-place" id="rpPlace"></span>
      <div class="rp-specs" role="list" id="rpSpecs"></div>
      <p class="rp-copy" id="rpCopy"></p>
      <p class="rp-copy">Every room at VIK is individual. The room reserved is
        the room type, not the individual room, unless one is named on the
        confirmation — which the reservations team is glad to do.</p>
    </div>

    <aside class="rp-aside">
      <span class="section-eyebrow ui-label">Reserve</span>
      <p>Rates vary by season. The team answers within the day.</p>
      <a class="btn-solid" href="#" data-book><span>Check availability</span></a>
    </aside>
  </div>

  <section class="section rp-others" aria-label="Other rooms in this house">
    <div class="section-head r">
      <div><span class="section-eyebrow ui-label">The house</span></div>
      <div><h2 class="section-title" id="rpOthersTitle">The other rooms</h2></div>
    </div>
    <div class="roomreel" data-rooms tabindex="0" aria-label="Other rooms">
      <div class="roomreel-bar" role="tablist" aria-label="Filter rooms"></div>
      <div class="roomreel-track" id="rpOthers"></div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";
  const R = window.VIK_ROOMS;
  const key = new URLSearchParams(location.search).get("r");
  const room = R[key] || R[Object.keys(R)[0]];
  const T = "../_assets/img/t/";
  const stem = s => "rooms__" + room.house + "__" + s.file.replace(/\.jpg$/, "");
  const src = s => T + stem(s) + "-w" + Math.min(900, Math.max.apply(null, s.w)) + ".jpg";
  const srcset = s => s.w.map(w => T + stem(s) + "-w" + w + ".jpg " + w + "w").join(", ");

  document.title = room.name + " · " + room.houseName;
  document.getElementById("rpTitle").textContent = room.name;
  document.getElementById("rpPlace").textContent = room.houseName + " · " + room.group;
  document.getElementById("rpCopy").textContent = room.copy;
  document.getElementById("rpCrumb").innerHTML =
    '<a href="../vik-retreats/">VIK Retreats</a><span>·</span>' +
    '<a href="' + room.houseHref + '">' + room.houseName + '</a><span>·</span>' +
    '<span>' + room.name + '</span>';
  document.getElementById("rpSpecs").innerHTML = room.specs.map(s =>
    '<div class="rp-spec" role="listitem"><span class="rp-spec__l">' + s[0] +
    '</span><span class="rp-spec__v">' + s[1] + '</span></div>').join("");

  /* the hero, and the strip beside it. A room with one photograph gets
     one photograph — the strip is not padded with the same picture. */
  const shots = room.shots;
  const thumbs = shots.slice(1, 4);
  document.getElementById("rpHero").innerHTML =
    '<div class="rp-hero__main"><img src="' + src(shots[0]) + '" srcset="' + srcset(shots[0]) +
    '" sizes="(max-width:900px) 100vw, 70vw" alt="' + room.name + '" loading="eager"></div>' +
    (thumbs.length ? '<div class="rp-strip">' + thumbs.map(s =>
      '<div class="rp-thumb"><img src="' + src(s) + '" alt="' + room.name + '" loading="lazy"></div>'
    ).join("") + '</div>' : "");

  /* the other rooms of the same house, on the reel */
  const others = Object.keys(R).filter(k => R[k].house === room.house && k !== key);
  document.getElementById("rpOthersTitle").textContent =
    "The other rooms at " + room.houseName;
  document.getElementById("rpOthers").innerHTML = others.map((k, i) => {
    const o = R[k], s0 = o.shots[0];
    const st = "rooms__" + o.house + "__" + s0.file.replace(/\.jpg$/, "");
    return '<a class="wall-tile" href="../room/?r=' + k + '" data-cat="all"' +
      ' data-name="' + o.name + '" data-meta="' + o.houseName + ' · ' + o.group + '">' +
      '<img src="' + T + st + '-w' + Math.min(900, Math.max.apply(null, s0.w)) + '.jpg" alt="' +
      o.name + '" loading="lazy" decoding="async">' +
      '<span class="rr-body"><span class="rr-i">' + String(i + 1).padStart(2, "0") +
      '</span><span class="rr-name">' + o.name + '</span>' +
      '<span class="rr-meta">' + o.houseName + ' · ' + o.group + '</span></span></a>';
  }).join("");
})();
</script>
